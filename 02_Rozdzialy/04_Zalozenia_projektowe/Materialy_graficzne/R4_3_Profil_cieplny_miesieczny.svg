<!-- annotation box -->
<rect x="120" y="378" width="490" height="52" fill="#f4f1ea" stroke="#d6cfc0" stroke-width="1"/>
<text x="365" y="396" text-anchor="middle" font-size="11.5" fill="#1a1a1a"><tspan font-weight="bold">Baza letnia wyznacza górną granicę mocy cieplnej jednostki kogeneracyjnej</tspan></text>
<text x="365" y="412" text-anchor="middle" font-size="11" fill="#444">pracującej całorocznie bez konieczności odprowadzania nadwyżek ciepła.</text>
<text x="365" y="426" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Stosunek styczeń / lipiec = 5,0 : 1</text>
</svg>
