<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, 'Times New Roman', serif">
<rect width="720" height="440" fill="#ffffff"/>

<text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Dobowy profil obciążenia elektrycznego</text>
<text x="360" y="42" text-anchor="middle" font-size="12" fill="#555">Porównanie profilu własnego z profilem syntetycznym HOMER Pro</text>

<!-- gridlines -->
<g stroke="#d8d8d8" stroke-width="1">
<line x1="90" y1="340" x2="680" y2="340"/>
<line x1="90" y1="270.9" x2="680" y2="270.9"/>
<line x1="90" y1="201.9" x2="680" y2="201.9"/>
<line x1="90" y1="132.8" x2="680" y2="132.8"/>
<line x1="90" y1="63.8" x2="680" y2="63.8"/>
</g>
<g font-size="11" fill="#555" text-anchor="end">
<text x="82" y="344">0</text>
<text x="82" y="275">50</text>
<text x="82" y="206">100</text>
<text x="82" y="137">150</text>
<text x="82" y="68">200</text>
</g>
<text x="30" y="200" font-size="12" fill="#333" transform="rotate(-90 30 200)" text-anchor="middle">Moc [kW]</text>

<line x1="90" y1="340" x2="680" y2="340" stroke="#444" stroke-width="1.5"/>
<line x1="90" y1="55" x2="90" y2="340" stroke="#444" stroke-width="1.5"/>

<!-- synthetic peak reference -->
<line x1="90" y1="70.7" x2="680" y2="70.7" stroke="#b5452f" stroke-width="2" stroke-dasharray="7,4"/>
<text x="676" y="64" text-anchor="end" font-size="11.5" fill="#b5452f" font-weight="bold">szczyt profilu syntetycznego HOMER ≈ 195 kW</text>

<!-- own peak -->
<line x1="90" y1="255.2" x2="680" y2="255.2" stroke="#2c5f8d" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="676" y="250" text-anchor="end" font-size="11" fill="#2c5f8d">szczyt profilu własnego 61,4 kW</text>

<!-- mean -->
<line x1="90" y1="279.4" x2="680" y2="279.4" stroke="#8a6d1f" stroke-width="1.1" stroke-dasharray="2,3"/>
<text x="96" y="293" font-size="10.5" fill="#8a6d1f" font-style="italic">moc średnia 43,9 kW</text>

<!-- own profile area -->
<path d="M 90,292.8 L 114.5,294.6 L 139,295.1 L 163.5,295.1 L 188,293.9 L 212.5,290.3 L 237,282.4 L 261.5,274.5 L 286,268.4 L 310.5,266.1 L 335,264.9 L 359.5,266.1 L 384,268.4 L 408.5,267.2 L 433,266.6 L 457.5,268.4 L 482,272.0 L 506.5,275.8 L 531,278.1 L 555.5,280.6 L 580,282.9 L 604.5,285.4 L 629,287.9 L 653.5,291.0 L 653.5,340 L 90,340 Z" fill="#2c5f8d" fill-opacity="0.18"/>
<path d="M 90,292.8 L 114.5,294.6 L 139,295.1 L 163.5,295.1 L 188,293.9 L 212.5,290.3 L 237,282.4 L 261.5,274.5 L 286,268.4 L 310.5,266.1 L 335,264.9 L 359.5,266.1 L 384,268.4 L 408.5,267.2 L 433,266.6 L 457.5,268.4 L 482,272.0 L 506.5,275.8 L 531,278.1 L 555.5,280.6 L 580,282.9 L 604.5,285.4 L 629,287.9 L 653.5,291.0" fill="none" stroke="#2c5f8d" stroke-width="2.4"/>

<!-- hour axis -->
<g font-size="10.5" fill="#555" text-anchor="middle">
<text x="90" y="356">0</text>
<text x="188" y="356">4</text>
<text x="286" y="356">8</text>
<text x="384" y="356">12</text>
<text x="482" y="356">16</text>
<text x="580" y="356">20</text>
<text x="653.5" y="356">23</text>
</g>
<text x="385" y="375" text-anchor="middle" font-size="12" fill="#333">Godzina doby</text>

<!-- annotation -->
<rect x="150" y="390" width="430" height="40" fill="#f4f1ea" stroke="#d6cfc0" stroke-width="1"/>
<text x="365" y="406" text-anchor="middle" font-size="11.5" fill="#1a1a1a">Współczynnik obciążenia: profil własny <tspan font-weight="bold">0,715</tspan>  ·  profil syntetyczny <tspan font-weight="bold">ok. 0,23</tspan></text>
<text x="365" y="422" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Profil syntetyczny zawyża moc szczytową 3,2-krotnie</text>
</svg>
