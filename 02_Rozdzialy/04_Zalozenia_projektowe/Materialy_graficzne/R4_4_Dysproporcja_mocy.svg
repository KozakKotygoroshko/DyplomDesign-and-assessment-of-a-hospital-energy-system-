<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Georgia, 'Times New Roman', serif">
<rect width="720" height="400" fill="#ffffff"/>

<text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Dysproporcja mocy źródła rezerwowego</text>
<text x="360" y="45" text-anchor="middle" font-size="12" fill="#555">Moc agregatu zainstalowanego wobec rzeczywistego zapotrzebowania obiektu</text>

<!-- axis -->
<line x1="258" y1="80" x2="258" y2="330" stroke="#444" stroke-width="1.5"/>
<g stroke="#e0e0e0" stroke-width="1">
<line x1="341.4" y1="80" x2="341.4" y2="330"/>
<line x1="424.7" y1="80" x2="424.7" y2="330"/>
<line x1="508.1" y1="80" x2="508.1" y2="330"/>
<line x1="591.4" y1="80" x2="591.4" y2="330"/>
<line x1="674.8" y1="80" x2="674.8" y2="330"/>
</g>
<g font-size="10.5" fill="#666" text-anchor="middle">
<text x="258" y="346">0</text>
<text x="341.4" y="346">50</text>
<text x="424.7" y="346">100</text>
<text x="508.1" y="346">150</text>
<text x="591.4" y="346">200</text>
<text x="674.8" y="346">250</text>
</g>
<text x="466" y="366" text-anchor="middle" font-size="12" fill="#333">Moc czynna [kW]</text>

<!-- bar 1 -->
<rect x="258" y="88" width="30.7" height="34" fill="#4a7a4a"/>
<text x="250" y="105" text-anchor="end" font-size="12" fill="#1a1a1a">Odbiory krytyczne (§ 30 Rozp. MZ)</text>
<text x="250" y="119" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">30% mocy szczytowej</text>
<text x="297" y="110" font-size="12" font-weight="bold" fill="#4a7a4a">18,4 kW</text>

<!-- bar 2 -->
<rect x="258" y="143" width="78.0" height="34" fill="#2c5f8d"/>
<text x="250" y="160" text-anchor="end" font-size="12" fill="#1a1a1a">Obciążenie średnie w czasie awarii</text>
<text x="250" y="174" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">wariant A1, styczeń</text>
<text x="344" y="165" font-size="12" font-weight="bold" fill="#2c5f8d">46,8 kW</text>

<!-- bar 3 -->
<rect x="258" y="198" width="102.3" height="34" fill="#3d7fae"/>
<text x="250" y="215" text-anchor="end" font-size="12" fill="#1a1a1a">Moc szczytowa obiektu</text>
<text x="250" y="229" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">z profilu własnego</text>
<text x="368" y="220" font-size="12" font-weight="bold" fill="#3d7fae">61,4 kW</text>

<!-- bar 4 -->
<rect x="258" y="258" width="430.1" height="42" fill="#b5452f"/>
<text x="250" y="275" text-anchor="end" font-size="12" fill="#1a1a1a" font-weight="bold">Agregat zainstalowany (PRP)</text>
<text x="250" y="290" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">Grupel G0356BDGRAA5T4000S</text>
<text x="478" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">258 kW</text>

<!-- ratio annotations -->
<text x="700" y="110" text-anchor="end" font-size="11" fill="#888">1,0×</text>
<text x="700" y="165" text-anchor="end" font-size="11" fill="#888">2,5×</text>
<text x="700" y="220" text-anchor="end" font-size="11" fill="#888">3,3×</text>
<text x="700" y="284" text-anchor="end" font-size="12" fill="#b5452f" font-weight="bold">14,0×</text>

<!-- note -->
<text x="360" y="386" text-anchor="middle" font-size="11.5" fill="#444">Obciążenie względne agregatu podczas awarii: <tspan font-weight="bold" fill="#b5452f">18,1% mocy znamionowej</tspan> — poniżej zakresu zalecanego (30–80%)</text>
</svg>
