<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, 'Times New Roman', serif">
<rect width="720" height="440" fill="#ffffff"/>

<text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Zużycie energii w latach 2023–2025</text>

<!-- gridlines -->
<g stroke="#d8d8d8" stroke-width="1">
<line x1="90" y1="340" x2="680" y2="340"/>
<line x1="90" y1="290" x2="680" y2="290"/>
<line x1="90" y1="240" x2="680" y2="240"/>
<line x1="90" y1="190" x2="680" y2="190"/>
<line x1="90" y1="140" x2="680" y2="140"/>
<line x1="90" y1="90" x2="680" y2="90"/>
<line x1="90" y1="50" x2="680" y2="50"/>
</g>
<g font-size="11" fill="#555" text-anchor="end">
<text x="82" y="344">0</text>
<text x="82" y="294">150</text>
<text x="82" y="244">300</text>
<text x="82" y="194">450</text>
<text x="82" y="144">600</text>
<text x="82" y="94">750</text>
<text x="82" y="54">900</text>
</g>
<text x="30" y="200" font-size="12" fill="#333" transform="rotate(-90 30 200)" text-anchor="middle">Zużycie energii [MWh/rok]</text>

<line x1="90" y1="340" x2="680" y2="340" stroke="#444" stroke-width="1.5"/>
<line x1="90" y1="50" x2="90" y2="340" stroke="#444" stroke-width="1.5"/>

<!-- 2023 -->
<rect x="125" y="215.6" width="60" height="124.4" fill="#2c5f8d"/>
<rect x="195" y="78.8" width="60" height="261.2" fill="#b5452f"/>
<text x="155" y="209" text-anchor="middle" font-size="11" fill="#2c5f8d" font-weight="bold">373,2</text>
<text x="225" y="72" text-anchor="middle" font-size="11" fill="#b5452f" font-weight="bold">783,6</text>
<text x="190" y="362" text-anchor="middle" font-size="13" fill="#1a1a1a">2023</text>

<!-- 2024 -->
<rect x="295" y="248.1" width="60" height="91.9" fill="#2c5f8d"/>
<rect x="365" y="84.4" width="60" height="255.6" fill="#b5452f"/>
<text x="325" y="241" text-anchor="middle" font-size="11" fill="#2c5f8d" font-weight="bold">275,7</text>
<text x="395" y="78" text-anchor="middle" font-size="11" fill="#b5452f" font-weight="bold">766,7</text>
<text x="360" y="362" text-anchor="middle" font-size="13" fill="#1a1a1a">2024</text>

<!-- 2025 -->
<rect x="465" y="211.9" width="60" height="128.1" fill="#2c5f8d" stroke="#163a59" stroke-width="2"/>
<rect x="535" y="69.7" width="60" height="270.3" fill="#b5452f" stroke="#7d2d1d" stroke-width="2"/>
<text x="495" y="205" text-anchor="middle" font-size="11" fill="#2c5f8d" font-weight="bold">384,4</text>
<text x="565" y="63" text-anchor="middle" font-size="11" fill="#b5452f" font-weight="bold">810,8</text>
<text x="530" y="362" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">2025</text>
<text x="530" y="378" text-anchor="middle" font-size="10" fill="#555" font-style="italic">rok przyjęty do obliczeń</text>

<!-- anomaly marker -->
<path d="M 325 268 L 325 300 L 290 300" fill="none" stroke="#8a6d1f" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="286" y="304" text-anchor="end" font-size="10.5" fill="#8a6d1f" font-style="italic">−20% wobec średniej</text>
<text x="286" y="318" text-anchor="end" font-size="10.5" fill="#8a6d1f" font-style="italic">— rok odstający</text>

<!-- legend -->
<rect x="200" y="396" width="16" height="12" fill="#2c5f8d"/>
<text x="222" y="406" font-size="12" fill="#1a1a1a">energia elektryczna</text>
<rect x="380" y="396" width="16" height="12" fill="#b5452f"/>
<text x="402" y="406" font-size="12" fill="#1a1a1a">ciepło (przeliczone z GJ)</text>

<text x="360" y="428" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Źródło: odpowiedź Szpitala Powiatowego w Pyrzycach z 21.09.2026</text>
</svg>
