<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="720" height="440" fill="#ffffff"/>

<text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Zużycie paliwa podczas awarii — porównanie konfiguracji</text>
<text x="360" y="42" text-anchor="middle" font-size="12" fill="#555">Warianty A1 i A2 — paliwo zużyte przez źródło sterowalne, seria V2</text>

