<g stroke="#d8d8d8" stroke-width="1">
<line x1="90" y1="301.4" x2="680" y2="301.4"/>
<line x1="90" y1="262.9" x2="680" y2="262.9"/>
<line x1="90" y1="224.3" x2="680" y2="224.3"/>
<line x1="90" y1="185.7" x2="680" y2="185.7"/>
<line x1="90" y1="147.1" x2="680" y2="147.1"/>
<line x1="90" y1="108.6" x2="680" y2="108.6"/>
<line x1="90" y1="70" x2="680" y2="70"/>
</g>
<g font-size="11" fill="#555" text-anchor="end">
<text x="82" y="344">0</text>
<text x="82" y="305">200</text>
<text x="82" y="267">400</text>
<text x="82" y="228">600</text>
<text x="82" y="190">800</text>
<text x="82" y="151">1&#160;000</text>
<text x="82" y="113">1&#160;200</text>
<text x="82" y="74">1&#160;400</text>
</g>
<text x="26" y="205" font-size="11" fill="#555" transform="rotate(-90 26 205)" text-anchor="middle">Zużycie paliwa [l] / [m³]</text>

<!-- A1 bars -->
<rect x="139.5" y="144.6" width="60" height="195.4" fill="#8a6d1f"/>
<rect x="139.5" y="144.6" width="60" height="21.8" fill="#b5452f"/>
<rect x="207.5" y="157.2" width="60" height="182.8" fill="#2c5f8d"/>
<rect x="207.5" y="157.2" width="60" height="9.2" fill="#b5452f"/>
<rect x="275.5" y="96.4" width="60" height="243.6" fill="#4a7a4a"/>

<!-- A2 bars -->
<rect x="434.5" y="283.7" width="60" height="56.3" fill="#8a6d1f"/>
<rect x="502.5" y="297.4" width="60" height="42.6" fill="#2c5f8d"/>
<rect x="570.5" y="270.4" width="60" height="69.6" fill="#4a7a4a"/>

<!-- 900 l usable capacity (diesel only) -->
<line x1="132" y1="166.4" x2="275" y2="166.4" stroke="#b5452f" stroke-width="1.5" stroke-dasharray="6,3"/>
<line x1="427" y1="166.4" x2="570" y2="166.4" stroke="#b5452f" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="498.5" y="159" text-anchor="middle" font-size="10.5" fill="#b5452f" font-style="italic">900 l — pojemność użyteczna zbiornika</text>

<!-- value labels A1 -->
<text x="169.5" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b5452f">deficyt 113 l</text>
<text x="169.5" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f">1&#160;013 l</text>
<text x="237.5" y="137" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b5452f">deficyt 48 l</text>
<text x="237.5" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f8d">948 l</text>
<text x="305.5" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a4a">1&#160;263 m³</text>

<!-- value labels A2 -->
<text x="464.5" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f">292 l</text>
<text x="532.5" y="291" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f8d">221 l</text>
<text x="532.5" y="276" text-anchor="middle" font-size="10.5" fill="#2c5f8d" font-style="italic">−24,3% (BESS)</text>
<text x="600.5" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a4a">361 m³</text>

<!-- axes -->
<line x1="90" y1="340" x2="680" y2="340" stroke="#444" stroke-width="1.5"/>
<line x1="90" y1="70" x2="90" y2="340" stroke="#444" stroke-width="1.5"/>

<!-- group labels -->
<g text-anchor="middle">
<text x="237.5" y="360" font-size="13" font-weight="bold" fill="#1a1a1a">A1</text>
<text x="237.5" y="375" font-size="10.5" fill="#666" font-style="italic">black-sky 72 h</text>
<text x="532.5" y="360" font-size="13" font-weight="bold" fill="#1a1a1a">A2</text>
<text x="532.5" y="375" font-size="10.5" fill="#666" font-style="italic">seria przerw, łącznie 21 h</text>
</g>

<!-- legend -->
<rect x="82" y="390" width="16" height="12" fill="#8a6d1f"/>
<text x="103" y="400" font-size="11.5" fill="#1a1a1a">K1 — olej napędowy [l]</text>
<rect x="244" y="390" width="16" height="12" fill="#2c5f8d"/>
<text x="265" y="400" font-size="11.5" fill="#1a1a1a">K2 — olej napędowy [l]</text>
<rect x="406" y="390" width="16" height="12" fill="#4a7a4a"/>
<text x="427" y="400" font-size="11.5" fill="#1a1a1a">K3 — gaz ziemny [m³]</text>
<rect x="562" y="390" width="16" height="12" fill="#b5452f"/>
<text x="583" y="400" font-size="11.5" fill="#1a1a1a">ponad 900 l</text>

<text x="360" y="420" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">K3 zasilana gazem z sieci — nie podlega ograniczeniu pojemności zbiornika.</text>
<text x="360" y="434" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Źródło: obliczenia własne w HOMER Pro 3.18.4, seria V2; pojemność użyteczna wg tabliczki znamionowej Grupel</text>
