<text x="385" y="374" text-anchor="middle" font-size="11" fill="#555">Zapas paliwa w zbiorniku [l]</text>

<!-- 72 h requirement -->
<line x1="90" y1="124" x2="680" y2="124" stroke="#444" stroke-width="1.3" stroke-dasharray="6,4"/>
<text x="96" y="118" font-size="11" fill="#444">72 h — czas trwania awarii A1</text>

<!-- usable capacity 900 l -->
<line x1="532.5" y1="70" x2="532.5" y2="340" stroke="#b5452f" stroke-width="1.5"/>
<text x="526" y="318" text-anchor="end" font-size="10.5" fill="#b5452f" font-weight="bold">900 l</text>
<text x="526" y="331" text-anchor="end" font-size="10.5" fill="#b5452f" font-style="italic">pojemność użyteczna</text>

<!-- required K1 1013 l -->
<line x1="588.1" y1="124" x2="588.1" y2="340" stroke="#8a6d1f" stroke-width="1" stroke-dasharray="3,2"/>
<text x="594" y="318" font-size="10.5" fill="#8a6d1f" font-weight="bold">1&#160;013 l</text>
<text x="594" y="331" font-size="10.5" fill="#8a6d1f" font-style="italic">wymagane (K1)</text>

<!-- deficit annotation -->
<text x="560.3" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b5452f">deficyt</text>
<text x="560.3" y="276" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b5452f">113 l</text>

<!-- lines -->
<line x1="90" y1="340" x2="680" y2="84.1" stroke="#8a6d1f" stroke-width="2.5"/>
<line x1="90" y1="340" x2="672.6" y2="70" stroke="#2c5f8d" stroke-width="2.5" stroke-dasharray="8,4"/>

<!-- points at 900 l -->
<circle cx="532.5" cy="148" r="4.5" fill="#8a6d1f" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="532.5" cy="135" r="4.5" fill="#2c5f8d" stroke="#ffffff" stroke-width="1.5"/>
<text x="539" y="166" font-size="11" font-weight="bold" fill="#8a6d1f">64,0 h</text>
<text x="526" y="121" text-anchor="end" font-size="11" font-weight="bold" fill="#2c5f8d">68,4 h</text>

<!-- axes -->
<line x1="90" y1="340" x2="680" y2="340" stroke="#444" stroke-width="1.5"/>
<line x1="90" y1="70" x2="90" y2="340" stroke="#444" stroke-width="1.5"/>

<!-- legend -->
<line x1="110" y1="398" x2="136" y2="398" stroke="#8a6d1f" stroke-width="2.5"/>
<text x="142" y="402" font-size="12" fill="#1a1a1a">K1 — Baza (14,07 l/h)</text>
<line x1="300" y1="398" x2="326" y2="398" stroke="#2c5f8d" stroke-width="2.5" stroke-dasharray="8,4"/>
<text x="332" y="402" font-size="12" fill="#1a1a1a">K2 — Hybryda (13,17 l/h)</text>
<rect x="510" y="392" width="16" height="12" fill="#b5452f" fill-opacity="0.25" stroke="#b5452f" stroke-width="0.8"/>
<text x="532" y="402" font-size="12" fill="#1a1a1a">deficyt paliwa K1</text>

<text x="360" y="428" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Zużycie średnie: K1 1&#160;013 l / 72 h; K2 948 l / 72 h. Źródło: obliczenia własne, HOMER Pro, seria V2; tabliczka znamionowa Grupel</text>
