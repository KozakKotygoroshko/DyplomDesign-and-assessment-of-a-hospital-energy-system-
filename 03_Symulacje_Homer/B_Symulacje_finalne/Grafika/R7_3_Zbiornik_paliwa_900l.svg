<line x1="90" y1="70" x2="680" y2="70"/>
<line x1="188.3" y1="70" x2="188.3" y2="340"/>
<line x1="286.7" y1="70" x2="286.7" y2="340"/>
<line x1="385" y1="70" x2="385" y2="340"/>
<line x1="483.3" y1="70" x2="483.3" y2="340"/>
<line x1="581.7" y1="70" x2="581.7" y2="340"/>
<line x1="680" y1="70" x2="680" y2="340"/>
</g>
<g font-size="11" fill="#555" text-anchor="end">
<text x="82" y="344">0</text>
<text x="82" y="314">10</text>
<text x="82" y="284">20</text>
<text x="82" y="254">30</text>
<text x="82" y="224">40</text>
<text x="82" y="194">50</text>
<text x="82" y="164">60</text>
<text x="82" y="134">70</text>
<text x="82" y="104">80</text>
<text x="82" y="74">90</text>
</g>
<g font-size="11" fill="#555" text-anchor="middle">
<text x="90" y="356">0</text>
<text x="188.3" y="356">200</text>
<text x="286.7" y="356">400</text>
<text x="385" y="356">600</text>
<text x="483.3" y="356">800</text>
