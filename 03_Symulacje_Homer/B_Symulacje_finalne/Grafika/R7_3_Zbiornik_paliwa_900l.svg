<text x="360" y="42" text-anchor="middle" font-size="12" fill="#555">Wariant A1 (black-sky 72 h) — średnie zużycie paliwa wyznaczone w HOMER Pro</text>

<!-- deficit band K1: 900–1013 l -->
<rect x="532.5" y="70" width="55.6" height="270" fill="#b5452f" fill-opacity="0.12"/>

<!-- gridlines -->
<g stroke="#d8d8d8" stroke-width="1">
<line x1="90" y1="310" x2="680" y2="310"/>
