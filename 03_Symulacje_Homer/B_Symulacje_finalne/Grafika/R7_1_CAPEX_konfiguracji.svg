<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="720" height="440" fill="#ffffff"/>

<text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Nakłady inwestycyjne — porównanie konfiguracji</text>
<text x="360" y="42" text-anchor="middle" font-size="12" fill="#555">Wariant A0 — architektury wg tabeli optymalizacyjnej HOMER Pro, seria V2</text>

<!-- gridlines -->
<g stroke="#d8d8d8" stroke-width="1">
<line x1="90" y1="295" x2="680" y2="295"/>
<line x1="90" y1="250" x2="680" y2="250"/>
<line x1="90" y1="205" x2="680" y2="205"/>
<line x1="90" y1="160" x2="680" y2="160"/>
<line x1="90" y1="115" x2="680" y2="115"/>
<line x1="90" y1="70" x2="680" y2="70"/>
</g>
<g font-size="11" fill="#555" text-anchor="end">
<text x="82" y="344">0</text>
<text x="82" y="299">100</text>
<text x="82" y="254">200</text>
<text x="82" y="209">300</text>
<text x="82" y="164">400</text>
<text x="82" y="119">500</text>
<text x="82" y="74">600</text>
</g>
<text x="30" y="205" font-size="11" fill="#555" transform="rotate(-90 30 205)" text-anchor="middle">Nakłady inwestycyjne CAPEX [tys. $]</text>

<!-- callout -->
<rect x="112" y="96" width="220" height="50" fill="#f4f1ea" stroke="#d6cfc0" stroke-width="1"/>
<text x="122" y="116" font-size="12" fill="#1a1a1a">CAPEX K3 / CAPEX K1 = <tspan font-weight="bold" fill="#8a6d1f">16,8×</tspan></text>
<text x="122" y="135" font-size="12" fill="#1a1a1a">CAPEX K2 / CAPEX K1 = <tspan font-weight="bold" fill="#8a6d1f">5,3×</tspan></text>

<!-- bars -->
<text x="163.75" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">0 $</text>

<rect x="271.25" y="324.7" width="80" height="15.3" fill="#8a6d1f"/>
<text x="311.25" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f">34&#160;000 $</text>

<rect x="418.75" y="258.7" width="80" height="81.3" fill="#2c5f8d"/>
<text x="458.75" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f8d">180&#160;638 $</text>

<rect x="566.25" y="82.7" width="80" height="257.3" fill="#4a7a4a"/>
<text x="606.25" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a4a">571&#160;869 $</text>

<!-- axes -->
<line x1="90" y1="340" x2="680" y2="340" stroke="#444" stroke-width="1.5"/>
<line x1="90" y1="70" x2="90" y2="340" stroke="#444" stroke-width="1.5"/>

<!-- category labels -->
<g text-anchor="middle">
<text x="163.75" y="360" font-size="13" fill="#1a1a1a">Odniesienie</text>
<text x="163.75" y="376" font-size="10.5" fill="#666" font-style="italic">sama sieć</text>
<text x="311.25" y="360" font-size="13" fill="#1a1a1a">K1 — Baza</text>
<text x="311.25" y="376" font-size="10.5" fill="#666" font-style="italic">agregat 68 kW</text>
<text x="458.75" y="360" font-size="13" fill="#1a1a1a">K2 — Hybryda</text>
<text x="458.75" y="376" font-size="10.5" fill="#666" font-style="italic">PV 124 kWp + agregat + BESS</text>
<text x="606.25" y="360" font-size="13" fill="#1a1a1a">K3 — Mikrosieć</text>
<text x="606.25" y="376" font-size="10.5" fill="#666" font-style="italic">PV 124 kWp + CHP 100 kW</text>
</g>

<text x="360" y="428" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Źródło: obliczenia własne w HOMER Pro 3.18.4, seria V2 (21.09.2026), dane rzeczywiste szpitala</text>
