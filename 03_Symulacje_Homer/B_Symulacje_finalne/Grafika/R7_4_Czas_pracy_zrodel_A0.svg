<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="720" height="440" fill="#ffffff"/>

<text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Czas pracy źródeł sterowalnych w warunkach normalnych</text>
<text x="360" y="42" text-anchor="middle" font-size="12" fill="#555">Wariant A0 — roczny czas pracy agregatu i jednostki kogeneracyjnej, seria V2</text>

<!-- gridlines -->
<g stroke="#d8d8d8" stroke-width="1">
<line x1="90" y1="286" x2="680" y2="286"/>
<line x1="90" y1="232" x2="680" y2="232"/>
<line x1="90" y1="178" x2="680" y2="178"/>
<line x1="90" y1="124" x2="680" y2="124"/>
<line x1="90" y1="70" x2="680" y2="70"/>
</g>
<g font-size="11" fill="#555" text-anchor="end">
<text x="82" y="344">0</text>
<text x="82" y="290">500</text>
<text x="82" y="236">1&#160;000</text>
<text x="82" y="182">1&#160;500</text>
<text x="82" y="128">2&#160;000</text>
<text x="82" y="74">2&#160;500</text>
</g>
<text x="26" y="205" font-size="11" fill="#555" transform="rotate(-90 26 205)" text-anchor="middle">Czas pracy w roku [h]</text>

<!-- callout -->
<rect x="104" y="150" width="280" height="50" fill="#f4f1ea" stroke="#d6cfc0" stroke-width="1"/>
<text x="114" y="170" font-size="11.5" fill="#1a1a1a">Agregat w K1 i K2: <tspan font-weight="bold" fill="#b5452f">0 h pracy</tspan> w roku bezawaryjnym</text>
<text x="114" y="188" font-size="11.5" fill="#1a1a1a">— wyłącznie obciążenie kapitałowe</text>

<!-- bars -->
<text x="163.75" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f">0 h</text>
<text x="311.25" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f8d">0 h</text>

<rect x="418.75" y="285.6" width="80" height="54.4" fill="#4a7a4a"/>
<text x="458.75" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a4a">504 h</text>
<text x="458.75" y="278" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">5,8% roku</text>

<rect x="566.25" y="126.6" width="80" height="213.4" fill="#4a7a4a" fill-opacity="0.45" stroke="#4a7a4a" stroke-width="1.2"/>
<text x="606.25" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a4a">1&#160;976 h</text>
<text x="606.25" y="120" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">22,6% roku</text>

<!-- axes -->
<line x1="90" y1="340" x2="680" y2="340" stroke="#444" stroke-width="1.5"/>
<line x1="90" y1="70" x2="90" y2="340" stroke="#444" stroke-width="1.5"/>

<!-- category labels -->
<g text-anchor="middle">
<text x="163.75" y="360" font-size="13" fill="#1a1a1a">K1 — Baza</text>
<text x="163.75" y="376" font-size="10.5" fill="#666" font-style="italic">agregat 68 kW</text>
<text x="311.25" y="360" font-size="13" fill="#1a1a1a">K2 — Hybryda</text>
<text x="311.25" y="376" font-size="10.5" fill="#666" font-style="italic">agregat (z PV i BESS)</text>
<text x="458.75" y="360" font-size="13" fill="#1a1a1a">K3 — Mikrosieć</text>
<text x="458.75" y="376" font-size="10.5" fill="#666" font-style="italic">CHP 100 kW (z PV)</text>
<text x="606.25" y="360" font-size="13" fill="#1a1a1a">CHP 100 kW bez PV</text>
<text x="606.25" y="376" font-size="10.5" fill="#666" font-style="italic">(konfiguracja uzupełniająca)</text>
</g>

<text x="360" y="414" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Rok = 8&#160;760 h. Minimalne obciążenie robocze CHP 50% (dane producenta).</text>
<text x="360" y="428" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Źródło: obliczenia własne w HOMER Pro 3.18.4, seria V2 (21.09.2026)</text>
