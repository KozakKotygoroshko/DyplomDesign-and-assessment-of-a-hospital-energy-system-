<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="720" height="440" fill="#ffffff"/>

<text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Wyczerpanie zapasu paliwa podczas awarii black-sky (A1)</text>
<text x="360" y="42" text-anchor="middle" font-size="12" fill="#555">Paliwo pozostałe w zbiorniku agregatu — pojemność użyteczna 900 l, awaria 72 h</text>

<!-- deficit zone -->
<rect x="90" y="301.4" width="590" height="38.6" fill="#b5452f" fill-opacity="0.10"/>

<!-- gridlines -->
<g stroke="#d8d8d8" stroke-width="1">
<line x1="90" y1="262.9" x2="680" y2="262.9"/>
<line x1="90" y1="224.3" x2="680" y2="224.3"/>
<line x1="90" y1="185.7" x2="680" y2="185.7"/>
<line x1="90" y1="147.1" x2="680" y2="147.1"/>
<line x1="90" y1="108.6" x2="680" y2="108.6"/>
<line x1="90" y1="70" x2="680" y2="70"/>
<line x1="188.3" y1="70" x2="188.3" y2="340"/>
<line x1="286.7" y1="70" x2="286.7" y2="340"/>
<line x1="385" y1="70" x2="385" y2="340"/>
<line x1="483.3" y1="70" x2="483.3" y2="340"/>
<line x1="581.7" y1="70" x2="581.7" y2="340"/>
<line x1="680" y1="70" x2="680" y2="340"/>
</g>
<g font-size="11" fill="#555" text-anchor="end">
<text x="82" y="344">−150</text>
<text x="82" y="305">0</text>
<text x="82" y="267">150</text>
<text x="82" y="228">300</text>
<text x="82" y="190">450</text>
<text x="82" y="151">600</text>
<text x="82" y="113">750</text>
<text x="82" y="74">900</text>
</g>
<g font-size="11" fill="#555" text-anchor="middle">
<text x="90" y="356">0</text>
<text x="188.3" y="356">12</text>
<text x="286.7" y="356">24</text>
<text x="385" y="356">36</text>
<text x="483.3" y="356">48</text>
<text x="581.7" y="356">60</text>
<text x="680" y="356">72</text>
</g>
<text x="26" y="205" font-size="11" fill="#555" transform="rotate(-90 26 205)" text-anchor="middle">Paliwo w zbiorniku [l]</text>
<text x="385" y="374" text-anchor="middle" font-size="11" fill="#555">Czas od początku awarii [h]</text>

<!-- empty tank line -->
<line x1="90" y1="301.4" x2="680" y2="301.4" stroke="#b5452f" stroke-width="1.3"/>
<text x="96" y="328" font-size="10.5" fill="#b5452f" font-style="italic">strefa deficytu — zbiornik pusty, zapotrzebowanie niepokryte</text>

<!-- K1 -->
<line x1="90" y1="70" x2="614.4" y2="301.4" stroke="#8a6d1f" stroke-width="2.5"/>
<line x1="614.4" y1="301.4" x2="680" y2="330.5" stroke="#8a6d1f" stroke-width="2" stroke-dasharray="4,3"/>
<!-- K2 -->
<line x1="90" y1="70" x2="650.1" y2="301.4" stroke="#2c5f8d" stroke-width="2.5"/>
<line x1="650.1" y1="301.4" x2="680" y2="313.8" stroke="#2c5f8d" stroke-width="2" stroke-dasharray="4,3"/>

<!-- depletion points + drop lines -->
<line x1="614.4" y1="301.4" x2="614.4" y2="340" stroke="#8a6d1f" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="650.1" y1="301.4" x2="650.1" y2="340" stroke="#2c5f8d" stroke-width="1" stroke-dasharray="2,2"/>
<circle cx="614.4" cy="301.4" r="4.5" fill="#8a6d1f" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="650.1" cy="301.4" r="4.5" fill="#2c5f8d" stroke="#ffffff" stroke-width="1.5"/>
<text x="614.4" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">64,0</text>
<text x="650.1" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f8d">68,4</text>

<!-- deficit at 72 h -->
<text x="683" y="334" font-size="9.5" font-weight="bold" fill="#8a6d1f">−113 l</text>
<text x="683" y="317" font-size="9.5" font-weight="bold" fill="#2c5f8d">−48 l</text>

<!-- start label -->
<text x="98" y="64" font-size="10.5" fill="#666" font-style="italic">stan początkowy: 900 l (napełnienie 90%)</text>

<!-- callout -->
<rect x="420" y="80" width="256" height="84" fill="#f4f1ea" stroke="#d6cfc0" stroke-width="1"/>
<text x="430" y="98" font-size="11.5" font-weight="bold" fill="#1a1a1a">Wyczerpanie zapasu 900 l</text>
<text x="430" y="116" font-size="11" fill="#8a6d1f">K1 — Baza: <tspan font-weight="bold">64,0 h</tspan>, brak 8,0 h / 113 l</text>
<text x="430" y="133" font-size="11" fill="#2c5f8d">K2 — Hybryda: <tspan font-weight="bold">68,4 h</tspan>, brak 3,6 h / 48 l</text>
<text x="430" y="150" font-size="11" fill="#4a7a4a">K3 — Mikrosieć: <tspan font-weight="bold">bez limitu</tspan> (gaz z sieci)</text>

<!-- axes -->
<line x1="90" y1="340" x2="680" y2="340" stroke="#444" stroke-width="1.5"/>
<line x1="90" y1="70" x2="90" y2="340" stroke="#444" stroke-width="1.5"/>

<!-- legend -->
<line x1="150" y1="394" x2="176" y2="394" stroke="#8a6d1f" stroke-width="2.5"/>
<text x="182" y="398" font-size="12" fill="#1a1a1a">K1 — Baza (agregat 68 kW)</text>
<line x1="384" y1="394" x2="410" y2="394" stroke="#2c5f8d" stroke-width="2.5"/>
<text x="416" y="398" font-size="12" fill="#1a1a1a">K2 — Hybryda (PV + agregat + BESS)</text>

<text x="360" y="418" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Przebieg liniowy przy średnim zużyciu z HOMER Pro (K1: 14,07 l/h; K2: 13,17 l/h); odcinki przerywane — paliwo brakujące.</text>
<text x="360" y="432" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Przebieg godzinowy zależy od profilu obciążenia i produkcji PV. Źródło: obliczenia własne, seria V2; tabliczka Grupel</text>
