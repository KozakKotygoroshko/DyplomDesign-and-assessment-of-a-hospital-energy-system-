<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="720" height="440" fill="#ffffff"/>

<text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Analiza wrażliwości — autonomia agregatu przy zbiorniku 900 l</text>
<text x="360" y="42" text-anchor="middle" font-size="12" fill="#555">Trzy warianty charakterystyki zużycia paliwa oraz wynik symulacji HOMER Pro</text>

<!-- gridlines -->
<g stroke="#d8d8d8" stroke-width="1">
<line x1="286.25" y1="70" x2="286.25" y2="330"/>
<line x1="342.5" y1="70" x2="342.5" y2="330"/>
<line x1="398.75" y1="70" x2="398.75" y2="330"/>
<line x1="455" y1="70" x2="455" y2="330"/>
<line x1="511.25" y1="70" x2="511.25" y2="330"/>
<line x1="567.5" y1="70" x2="567.5" y2="330"/>
<line x1="623.75" y1="70" x2="623.75" y2="330"/>
<line x1="680" y1="70" x2="680" y2="330"/>
</g>
<g font-size="11" fill="#555" text-anchor="middle">
<text x="230" y="346">0</text>
<text x="286.25" y="346">10</text>
<text x="342.5" y="346">20</text>
<text x="398.75" y="346">30</text>
<text x="455" y="346">40</text>
<text x="511.25" y="346">50</text>
<text x="567.5" y="346">60</text>
<text x="623.75" y="346">70</text>
<text x="680" y="346">80</text>
</g>
<text x="455" y="364" text-anchor="middle" font-size="11" fill="#555">Czas pracy agregatu z zapasu 900 l [h]</text>

<!-- row 1: optimistic 68,8 h -->
<rect x="230" y="80" width="387" height="30" fill="#8a6d1f"/>
<rect x="617" y="80" width="18" height="30" fill="#b5452f" fill-opacity="0.25" stroke="#b5452f" stroke-width="1" stroke-dasharray="3,2"/>
<text x="611" y="100" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">68,8 h</text>
<text x="641" y="100" font-size="11" font-weight="bold" fill="#b5452f">−3,2 h</text>
<text x="222" y="93" text-anchor="end" font-size="12" fill="#1a1a1a">Wariant optymistyczny</text>
<text x="222" y="107" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">13,1 l/h · brak 42 l</text>

<!-- row 2: HOMER 64,0 h -->
<rect x="230" y="142" width="360" height="30" fill="#8a6d1f" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="590" y="142" width="45" height="30" fill="#b5452f" fill-opacity="0.25" stroke="#b5452f" stroke-width="1" stroke-dasharray="3,2"/>
<text x="584" y="162" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">64,0 h</text>
<text x="641" y="162" font-size="11" font-weight="bold" fill="#b5452f">−8,0 h</text>
<text x="222" y="155" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Symulacja HOMER (68 kW)</text>
<text x="222" y="169" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">14,07 l/h · brak 113 l</text>

<!-- row 3: medium 57,9 h -->
<rect x="230" y="204" width="325.7" height="30" fill="#8a6d1f"/>
<rect x="555.7" y="204" width="79.3" height="30" fill="#b5452f" fill-opacity="0.25" stroke="#b5452f" stroke-width="1" stroke-dasharray="3,2"/>
<text x="549.7" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">57,9 h</text>
<text x="641" y="224" font-size="11" font-weight="bold" fill="#b5452f">−14,1 h</text>
<text x="222" y="217" text-anchor="end" font-size="12" fill="#1a1a1a">Wariant średni</text>
<text x="222" y="231" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">15,5 l/h · brak 219 l</text>

<!-- row 4: conservative 50,1 h -->
<rect x="230" y="266" width="281.8" height="30" fill="#8a6d1f"/>
<rect x="511.8" y="266" width="123.2" height="30" fill="#b5452f" fill-opacity="0.25" stroke="#b5452f" stroke-width="1" stroke-dasharray="3,2"/>
<text x="505.8" y="286" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">50,1 h</text>
<text x="641" y="286" font-size="11" font-weight="bold" fill="#b5452f">−21,9 h</text>
<text x="222" y="279" text-anchor="end" font-size="12" fill="#1a1a1a">Wariant zachowawczy</text>
<text x="222" y="293" text-anchor="end" font-size="10.5" fill="#666" font-style="italic">18,0 l/h · brak 393 l</text>

<!-- 72 h requirement -->
<line x1="635" y1="66" x2="635" y2="330" stroke="#444" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="635" y="61" text-anchor="middle" font-size="11" fill="#444">72 h — awaria A1</text>

<!-- axis -->
<line x1="230" y1="70" x2="230" y2="330" stroke="#444" stroke-width="1.5"/>
<line x1="230" y1="330" x2="680" y2="330" stroke="#444" stroke-width="1.5"/>

<!-- legend -->
<rect x="170" y="384" width="16" height="12" fill="#8a6d1f"/>
<text x="192" y="394" font-size="12" fill="#1a1a1a">czas pracy z zapasu 900 l</text>
<rect x="400" y="384" width="16" height="12" fill="#b5452f" fill-opacity="0.25" stroke="#b5452f" stroke-width="1" stroke-dasharray="3,2"/>
<text x="422" y="394" font-size="12" fill="#1a1a1a">brakujący czas do 72 h</text>

<text x="360" y="414" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Obciążenie 46,79 kW (średnie w okresie awarii A1). W żadnym wariancie zbiornik nie pokrywa 72 h.</text>
<text x="360" y="428" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">Źródło: tabliczka znamionowa Grupel, analiza własna; obliczenia HOMER Pro, seria V2</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
